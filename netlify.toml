# Netlify — job agent dashboard (Next.js static export).
[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  # The API on the dev box (shared nginx + Let's Encrypt). Its CORS_ORIGINS
  # allows https://jackmiro.pt, https://www.jackmiro.pt and localhost:3000.
  NEXT_PUBLIC_API_URL = "https://api.jackmiro.pt"
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# Static export emits per-route .html; this is an SPA fallback for unknown paths
# (force=false → real files/assets are served first).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false
